# =====================================================================
#  NOVA: Android uchun ovozli yordamchi. BUTUN ILOVA SHU BITTA FAYLDA.
#
#  Ishlatish (GitHub'da bo'sh repozitoriy oching):
#   1. Add file > Create new file. Nom maydoniga yozing:  .github/workflows/build.yml
#   2. Shu faylning butun matnini qo'ying va Commit qiling.
#   3. Actions bo'limida "Nova APK" yig'iladi (8-15 daqiqa).
#   4. Tugagach, repozitoriyning o'ng tomonidagi "Releases" bo'limidan
#      app-debug.apk ni yuklab oling va telefonga o'rnating.
#
#  Fayl nima qiladi: ilova kodini (Kotlin, Gradle, Manifest) yaratadi,
#  o'zbekcha oflayn ovoz modelini (Vosk) APK ichiga joylaydi va APK yig'adi.
#  Ilovaning kodi pastda "Nova.kt" bo'limida turibdi, o'qish va o'zgartirish mumkin.
# =====================================================================
